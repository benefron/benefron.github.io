title: Ben Efron, PhD - Neuroscientist & Brain-Inspired Computing Researcher
email: benefron@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Postdoctoral Fellow in Brain Inspired Computing at University of Liège. 
  PhD in Systems Neuroscience from Weizmann Institute. Applying neuroscience 
  principles to machine learning, edge computing, and sensor integration.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://benefron.github.io" # the base hostname & protocol for your site, e.g. http://example.com
github_username: benefron
linkedin_username: ben-efron-b19256b2

# Build settings
theme: jekyll-theme-cayman
repository: benefron/benefron.github.io
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

