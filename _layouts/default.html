<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    {% seo %}
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Helvetica+Neue:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <header class="page-header" role="banner">
      <h1 class="project-name">{{ site.title | default: site.github.repository_name }}</h1>
      <h2 class="project-tagline">{{ site.description | default: site.github.project_tagline }}</h2>
    </header>

    <nav class="site-nav">
      <ul>
        <li><a href="{{ '/' | relative_url }}">Home</a></li>
        <li><a href="{{ '/research' | relative_url }}">Research</a></li>
        <li><a href="{{ '/publications' | relative_url }}">Publications</a></li>
        <li><a href="{{ '/cv' | relative_url }}">CV</a></li>
      </ul>
    </nav>

    <main id="content" class="main-content" role="main">
      {{ content }}

      <footer class="site-footer">
        <p>© {{ 'now' | date: "%Y" }} Ben Efron</p>
        <p>
          <a href="mailto:{{ site.email }}">Email</a> •
          <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}">LinkedIn</a> •
          <a href="https://github.com/{{ site.github_username }}">GitHub</a>
        </p>
      </footer>
    </main>
  </body>
</html>
